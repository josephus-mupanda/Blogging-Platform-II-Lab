
# GraphiQL endpoint is /graphiql. Pick one named operation when running.
query SearchPosts {
  posts(filter: {keyword: "spring", sort: NEWEST, page: 0, size: 10}) {
    items { id title authorId tags { id name } }
    totalElements
    totalPages
  }
}

query ReadDiscussion($postId: ID!) {
  post(id: $postId) { id title body }
  comments(postId: $postId) { id body authorName }
  reviews(postId: $postId) { averageRating reviews { rating text reviewerName } }
}

mutation CreateUser {
  createUser(input: {
    username: "sample-author", email: "sample-author@example.test",
    displayName: "Sample Author"
  }) { id username }
}

mutation AddPost($authorId: ID!, $tagIds: [ID!]) {
  createPost(authorId: $authorId,
    input: {title: "Spring Boot migration", body: "An article about Spring.", tagIds: $tagIds}) {
    id title tags { id name }
  }
}

mutation AddComment($postId: ID!, $authorId: ID!) {
  addComment(postId: $postId, authorId: $authorId, input: {body: "Thanks for the article."}) { id body }
}

mutation AddReview($postId: ID!, $reviewerId: ID!) {
  addReview(postId: $postId, reviewerId: $reviewerId, input: {rating: 5, text: "Helpful."}) { id rating }
}

mutation CreateTag {
  createTag(input: {name: "spring"}) { id name }
}

query Overview {
  users { id username displayName }
  tags { id name }
  dashboard { users posts tags comments reviews }
}

mutation DeletePost($id: ID!) {
  deletePost(id: $id)
}
