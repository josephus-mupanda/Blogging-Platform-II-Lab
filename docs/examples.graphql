
# GraphiQL endpoint is /graphiql. Pick one named operation when running.
# Use the Headers editor for authenticated operations.
query SearchPosts {
  posts(filter: {keyword: "spring", sort: NEWEST, page: 0, size: 10}) {
    items { id title authorId tags { id name } }
    totalElements
    totalPages
  }
}

query ReadDiscussion($postId: ID!) {
  post(id: $postId) { id title body }
  comments(postId: $postId) { id body authorName }
  reviews(postId: $postId) { averageRating reviews { rating text reviewerName } }
}

mutation SignUp {
  register(input: {
    username: "sample-author", email: "sample-author@example.test",
    password: "local-demo-password", displayName: "Sample Author", role: AUTHOR
  }) { id username role }
}

mutation AddPost($tagIds: [ID!]) {
  createPost(input: {title: "Spring Boot migration", body: "An article about Spring.", tagIds: $tagIds}) {
    id title tags { id name }
  }
}

mutation CommentAndReview($postId: ID!) {
  addComment(postId: $postId, input: {body: "Thanks for the article."}) { id body }
  addReview(postId: $postId, input: {rating: 5, text: "Helpful."}) { id rating }
}

mutation CreateTag {
  createTag(input: {name: "spring"}) { id name }
}

query AdminOverview {
  users { id username role active }
  tags { id name }
  dashboard { posts comments reviews tagUsage { name posts } }
  trash(kind: POST) { id label deletedAt }
}

mutation RestorePost($id: ID!) {
  restore(kind: POST, id: $id)
}
